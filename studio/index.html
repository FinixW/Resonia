<script>
const STUDIO_VERSION='0.1.1';
const $=id=>document.getElementById(id);$('ver').textContent='v'+STUDIO_VERSION;
const TPB=768;
function parseVos(buf){
  const d=new Uint8Array(buf),v=new DataView(buf);
  const u32=o=>v.getUint32(o,true),u16=o=>v.getUint16(o,true);
  const asc=(o,n)=>String.fromCharCode(...d.subarray(o,o+n));
  const dec=(b,e)=>{try{return new TextDecoder(e).decode(b)}catch(x){return ''}};
  const orig=u32(0)==3&&asc(8,3)=='inf',nw=u32(0)==2&&asc(8,12)=='Vosctemp.trk';
  if(!orig&&!nw)throw new Error('不支持的文件（可能是 VOS1/rank 格式）');
  let title,lenMs,ch=[],refs=[],mo=0,o;
  if(orig){
    mo=u32(0x18);o=0x40;
    const s=()=>{const n=d[o],r=dec(d.subarray(o+1,o+1+n),'gbk');o+=1+n;return r};
    if(asc(0x40,4)=='VOS1'){o=0x86;s()} // 带 VOS1 标记块的变体：多一个前导字符串（制作者标签），之后同原格式
    title=s();s();s();s();o-=0; // 4th string (author) consumed
    // layout: title, artist, extType, author
    lenMs=u32(o+2);o+=8+1022;
    for(let c=0;c<17;c++){
      const ins=u32(o),cnt=u32(o+4);o+=22;const notes=[];
      for(let k=0;k<cnt;k++,o+=13)notes.push({t:u32(o),len:u32(o+4),p:d[o+9],vel:d[o+10],ff:d[o+11],long:d[o+12]==0x80});
      ch.push({ins,notes});
    }
    const play=ch.pop(),idx=new Map();
    ch.forEach((c,i)=>c.notes.forEach((n,j)=>idx.set(i+':'+n.t+':'+n.p,j)));
    for(const n of play.notes){const c=n.ff&15,k=(n.ff>>4)-8,j=idx.get(c+':'+n.t+':'+n.p);if(j!==undefined&&k>=0&&k<7)refs.push({c,j,k})}
  }else{
    for(let i=0x20;i<d.length-4;i++)if(asc(i,4)=='MThd'){mo=i;break}
    const ver=asc(0x18,6);o=0x1e;
    const s=()=>{const n=u16(o),r=dec(d.subarray(o+2,o+2+n),'euc-kr');o+=2+n;return r};
    title=s();s();s();s();s();
    lenMs=u32(o+15);o+=19+1024;
    const nch=u32(o);o+=8;const ins=[];
    for(let i=0;i<nch;i++){ins.push(u32(o+1));o+=5}
    o+=4+u16(o+2)+4;
    for(let c=0;c<nch;c++){
      const cnt=u32(o);o+=5;const notes=[];
      for(let k=0;k<cnt;k++){notes.push({t:u32(o),p:d[o+4],vel:d[o+6],long:d[o+9]==1,len:u32(o+10)});o+=15;if(k<cnt-1)o++}
      ch.push({ins:ins[c],notes});
    }
    if(ver=='VOS022')o+=4;
    const n=u32(o);o+=4;
    for(let i=0;i<n;i++,o+=6){const c=d[o],j=u32(o+1),k=d[o+5];if(c<nch&&j<ch[c].notes.length&&k<7)refs.push({c,j,k})}
  }
  // MIDI: read every channel message of EVERY track; controller state is kept per MIDI channel (tracks sharing a channel merge, like a real synth)
  const div=v.getUint16(mo+12),ntr=v.getUint16(mo+10);let p=mo+14;const tempos=[],mraw=[],chanOf={},tk=[],CCN={0:'bm',32:'bl',7:'vol',11:'exp',10:'pan',1:'mod',74:'cut',91:'rev'};
  const vlq=()=>{let x=0,b;do{b=d[p++];x=(x<<7)|(b&127)}while(b&128);return x};
  for(let t=0;t<ntr&&asc(p,4)=='MTrk';t++){
    const end=p+8+v.getUint32(p+4);p+=8;let tick=0,run=0;
    while(p<end){
      tick+=vlq();let st=d[p];
      if(st==255){const ty=d[p+1];p+=2;const l=vlq();if(ty==0x51)tempos.push({tick,us:(d[p]<<16)|(d[p+1]<<8)|d[p+2]});p+=l}
      else if(st==240||st==247){p++;p+=vlq()}
      else{
        if(st&128){run=st;p++}else st=run;
        const ty=st&240,one=ty==192||ty==208,bb=one?[st,d[p]]:[st,d[p],d[p+1]];p+=one?1:2;
        mraw.push({tk:tick,q:mraw.length,b:bb});
        if(t>0){if(!tk[t-1])tk[t-1]={ch:st&15,prog:undefined};if(ty==192&&tk[t-1].prog===undefined)tk[t-1].prog=bb[1]}
      }
    }
    p=end;
  }
  tempos.sort((a,b)=>a.tick-b.tick);
  const segs=[{b:0,ms:0,us:500000}];let ms=0,bt=0,us=500000;
  for(const t of tempos){const b=t.tick/div;ms+=(b-bt)*us/1000;bt=b;us=t.us;segs.push({b,ms,us})}
  const beatMs=b=>{let s=segs[0];for(let i=segs.length-1;i>=0;i--)if(segs[i].b<=b){s=segs[i];break}return s.ms+(b-s.b)*s.us/1000},toMs=tk=>beatMs(tk/TPB);
  mraw.sort((a,b)=>a.tk-b.tk||a.q-b.q);
  const mev=mraw.map(r=>({ms:beatMs(r.tk/div),r:0,b:r.b}));
  const ctlM=Array.from({length:16},()=>({})),rs=Array.from({length:16},()=>({rm:0,rM:127,rL:127,nM:0,nL:0}));
  mraw.forEach((r,i)=>{
    const[st,a,b]=r.b,ty=st&240,c=st&15,C=ctlM[c],S=rs[c],ms=mev[i].ms,push=(k,val)=>(C[k]??=[]).push({ms,v:val});
    if(ty==192)push('prog',a);
    else if(ty==224)push('bend',((b<<7)|a)-8192);
    else if(ty==176){
      if(a==101||a==100){S.rm=0;if(a==101)S.rM=b;else S.rL=b}
      else if(a==99||a==98){S.rm=1;if(a==99)S.nM=b;else S.nL=b}
      else if(a==6){
        if(!S.rm&&S.rM==0&&S.rL==0)push('rng',b);
        else if(S.rm&&S.nM==26)((C.dl??={})[S.nL]??=[]).push({ms,v:b});
        else if(S.rm&&S.nM==28)((C.dp??={})[S.nL]??=[]).push({ms,v:b});
      }else{const k=CCN[a];if(k)push(k,b)}
    }
  });
  // VOS 通道 -> MIDI 通道：VOS 会丢掉没有音符的轨道，不能按序号硬配；按音色号顺序匹配 MIDI 轨道（鼓取第一条 10 号通道轨道），匹配不到再回退到序号
  const tUsed=new Set(),byIns={};let tPtr=0;
  ch.forEach((c,k)=>{
    if(!c.notes.length)return;
    let m=-1,hit=false;
    if(c.ins>=128){m=tk.findIndex(x=>x&&x.ch==9);hit=m>=0}
    else{for(let j=tPtr;j<tk.length;j++)if(tk[j]&&!tUsed.has(j)&&tk[j].prog===c.ins){m=j;hit=true;break}}
    if(m<0&&tk[k]&&!tUsed.has(k))m=k;
    if(m>=0){tUsed.add(m);if(hit&&c.ins<128)tPtr=m+1;chanOf[k]=tk[m].ch;if(hit&&c.ins<128)byIns[k]=c.ins}
  });
  const ctl=ch.map((_,k)=>{
    const c=ctlM[chanOf[k]!==undefined?chanOf[k]:(k&15)];
    if(byIns[k]===undefined)return c;
    return Object.assign({},c,{prog:[{ms:0,v:byIns[k]}].concat((c.prog||[]).filter(x=>x.ms>0))});
  });
  const used=new Set(),notes=[];
  for(const r of refs){
    const n=ch[r.c].notes[r.j];used.add(r.c+':'+r.j);
    const t=toMs(n.t),e=toMs(n.t+n.len);
    notes.push({t,lane:r.k,hold:n.long,end:n.long?e:t,snd:{ch:r.c,ins:ch[r.c].ins,p:n.p,vel:n.vel,dur:(e-t)/1000},done:false});
  }
  notes.sort((a,b)=>a.t-b.t);
  const back=[];
  ch.forEach((c,i)=>c.notes.forEach((n,j)=>{if(used.has(i+':'+j))return;const t=toMs(n.t);back.push({t,ch:i,ins:c.ins,p:n.p,vel:n.vel,dur:(toMs(n.t+n.len)-t)/1000})}));
  back.sort((a,b)=>a.t-b.t);
  return{title,lenMs,notes,back,ctl,mev,chan:chanOf,tracks:ntr-1,bpm:tempos.length?60e6/tempos[0].us:120};
}

// ---------- 压缩包（ZIP）读取：只用浏览器自带的 DecompressionStream ----------
async function readZip(ab){
  const dv=new DataView(ab),u8=new Uint8Array(ab);let p=ab.byteLength-22;
  while(p>=0&&dv.getUint32(p,true)!==0x06054b50)p--;
  if(p<0)throw new Error('不是有效的 ZIP 文件');
  const n=dv.getUint16(p+10,true);let q=dv.getUint32(p+16,true);const out=[];
  const dec=(b,utf)=>{if(utf)return new TextDecoder().decode(b);try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(x){return new TextDecoder('shift_jis').decode(b)}};
  for(let i=0;i<n;i++){
    if(dv.getUint32(q,true)!==0x02014b50)break;
    const fl=dv.getUint16(q+8,true),cm=dv.getUint16(q+10,true),cs=dv.getUint32(q+20,true),nl=dv.getUint16(q+28,true),el=dv.getUint16(q+30,true),cl=dv.getUint16(q+32,true),lo=dv.getUint32(q+42,true);
    const name=dec(u8.subarray(q+46,q+46+nl),fl&0x800);q+=46+nl+el+cl;
    if(name.endsWith('/'))continue;
    out.push({path:name,ab:async()=>{
      const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u8.subarray(ds,ds+cs);
      if(cm===0)return raw.slice().buffer;
      if(cm!==8)throw new Error('不支持的压缩方式 '+cm);
      return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    }});
  }
  return out;
}
// ---------- BMS / BME / BML 解析 ----------
function bmsText(ab){const u=new Uint8Array(ab);try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(x){}try{return new TextDecoder('shift_jis').decode(u)}catch(x){return new TextDecoder().decode(u)}}
function parseBms(txt){
  const H={},wav={},bmp={},bpmT={},stopT={},len={},ch=[],st=[];let rnd=1;
  const act=()=>st.every(s=>s.v);
  for(let L of txt.replace(/\r/g,'').split('\n')){
    L=L.trim();if(L[0]!='#')continue;let m;
    if((m=/^#(RANDOM|SETRANDOM)\s+(\d+)/i.exec(L))){if(act())rnd=/^R/i.test(m[1])?1+Math.floor(Math.random()*(+m[2]||1)):+m[2];continue}
    if((m=/^#IF\s+(\d+)/i.exec(L))){const v=rnd==+m[1];st.push({v,d:v});continue}
    if((m=/^#ELSEIF\s+(\d+)/i.exec(L))){const s=st[st.length-1];if(s){s.v=!s.d&&rnd==+m[1];s.d=s.d||s.v}continue}
    if(/^#ELSE\b/i.test(L)){const s=st[st.length-1];if(s){s.v=!s.d;s.d=true}continue}
    if(/^#END\s*IF\b/i.test(L)){st.pop();continue}
    if(/^#ENDRANDOM/i.test(L))continue;
    if(!act())continue;
    if((m=/^#(\d{3})([0-9A-Za-z]{2}):\s*(.*)$/.exec(L))){
      const me=+m[1],c=m[2].toUpperCase(),s=m[3].trim();
      if(c=='02')len[me]=parseFloat(s)||1;else ch.push({m:me,c,s:s.toUpperCase()});continue}
    if(!(m=/^#([A-Za-z0-9_]+)\s*[: ]?\s*(.*)$/.exec(L)))continue;
    const k=m[1].toUpperCase(),v=m[2].trim();
    if(/^WAV[0-9A-Z]{2}$/.test(k))wav[k.slice(3)]=v;
    else if(/^BMP[0-9A-Z]{2}$/.test(k))bmp[k.slice(3)]=v;
    else if(/^(EX)?BPM[0-9A-Z]{2}$/.test(k))bpmT[k.slice(-2)]=parseFloat(v);
    else if(/^STOP[0-9A-Z]{2}$/.test(k))stopT[k.slice(4)]=parseFloat(v);
    else H[k]=v;
  }
  const nm=Math.max(0,...ch.map(x=>x.m))+1,bs=[0];
  for(let i=0;i<nm;i++)bs.push(bs[i]+4*(len[i]||1));
  const bpm0=parseFloat(H.BPM)||120,tev=[],bgm=[],keys=[],lns=[],bgaE=[];
  const LANE={'1':0,'2':1,'3':2,'4':3,'5':4,'8':5,'9':6};
  let has67=false;
  for(const x of ch){
    const n=x.s.length>>1;if(!n)continue;
    for(let i=0;i<n;i++){
      const pr=x.s.substr(i*2,2);if(pr=='00')continue;
      const b=bs[x.m]+i/n*4*(len[x.m]||1),c=x.c;
      if(c=='03'){const v=parseInt(pr,16);if(v>0)tev.push({b,t:0,bpm:v})}
      else if(c=='08'){const v=bpmT[pr];if(v>0)tev.push({b,t:0,bpm:v})}
      else if(c=='09'){const v=stopT[pr];if(v>0)tev.push({b,t:1,sb:v/48})}
      else if(c=='01')bgm.push({b,id:pr});
      else if(c=='04'||c=='07'||c=='0A')bgaE.push({b,id:pr,l:c=='04'?0:c=='07'?1:2});
      else if(/^[12][1-9]$/.test(c)){
        const side=c[0],k=c[1];
        if(side=='1'&&LANE[k]!==undefined){keys.push({b,id:pr,l:LANE[k]});if(k=='8'||k=='9')has67=true}
        else bgm.push({b,id:pr});
      }else if(/^[56][1-9]$/.test(c)){
        const side=c[0],k=c[1];
        if(side=='5'&&LANE[k]!==undefined){lns.push({b,id:pr,l:LANE[k]});if(k=='8'||k=='9')has67=true}
      }
    }
  }
  tev.sort((a,b)=>a.b-b.b||a.t-b.t);
  const T=[{b:0,ms:0,bpm:bpm0}];
  for(const e of tev){
    const p=T[T.length-1],ms=p.ms+(e.b-p.b)*60000/p.bpm;
    T.push(e.t?{b:e.b,ms:ms+e.sb*60000/p.bpm,bpm:p.bpm}:{b:e.b,ms,bpm:e.bpm});
  }
  const toMs=b=>{let lo=0,hi=T.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(T[m].b<b)lo=m;else hi=m-1}const e=T[lo];return e.ms+(b-e.b)*60000/e.bpm};
  const sh=has67?0:1,lnobj=(H.LNOBJ||'').toUpperCase();
  const notes=[],back=bgm.map(x=>({t:toMs(x.b),id:x.id}));
  const byL=Array.from({length:7},()=>[]);
  for(const k of keys)byL[k.l].push(k);
  const mk=(l,t,e,id)=>notes.push({t,lane:l+sh,hold:e>t,end:Math.max(t,e),snd:{s:id,ch:0,ins:0,p:60,vel:127,dur:0},done:false});
  byL.forEach((a,l)=>{
    a.sort((x,y)=>x.b-y.b);let last=null;
    for(const k of a){
      if(lnobj&&k.id==lnobj&&last){last.end=toMs(k.b);last.hold=true;last=null;continue}
      const t=toMs(k.b);last={t,lane:l+sh,hold:false,end:t,snd:{s:k.id,ch:0,ins:0,p:60,vel:127,dur:0},done:false};notes.push(last);
    }
  });
  const byLn=Array.from({length:7},()=>[]);for(const k of lns)byLn[k.l].push(k);
  byLn.forEach((a,l)=>{a.sort((x,y)=>x.b-y.b);for(let i=0;i+1<a.length;i+=2)mk(l,toMs(a[i].b),toMs(a[i+1].b),a[i].id)});
  notes.sort((a,b)=>a.t-b.t);back.sort((a,b)=>a.t-b.t);
  const used=new Set([...notes.map(n=>n.snd.s),...back.map(b=>b.id)]);
  const bga=bgaE.map(x=>({t:toMs(x.b),id:x.id,l:x.l})).sort((a,b)=>a.t-b.t);
  return{H,bmp,bga,title:[H.TITLE,H.SUBTITLE].filter(Boolean).join(' '),artist:H.ARTIST||'',level:H.PLAYLEVEL||'',keys:has67?7:5,wav,notes,back,used,bpm:bpm0,
    nlane:new Set(notes.map(n=>n.lane)).size};
}
const AUD=/\.(wav|ogg|mp3|flac|m4a|opus|aac)$/i,VIS=/\.(png|jpe?g|bmp|gif|webp|mp4|webm|mpe?g|avi|wmv|m4v)$/i;
let pack=null;
function mkRes(entries){
  const full=new Map(),base=new Map(),nA=new Map(),nV=new Map();
  for(const e of entries){const p=e.path.replace(/\\/g,'/').toLowerCase(),b=p.split('/').pop(),n=b.replace(/\.[^.]+$/,'');full.set(p,e);if(!base.has(b))base.set(b,e);
    if(AUD.test(b)&&!nA.has(n))nA.set(n,e);if(VIS.test(b)&&!nV.has(n))nV.set(n,e)}
  return (name,kind)=>{const p=name.replace(/\\/g,'/').toLowerCase().replace(/^\.\//,''),b=p.split('/').pop();return full.get(p)||base.get(b)||(kind=='v'?nV:nA).get(b.replace(/\.[^.]+$/,''))||null};
}
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
async function deflateRaw(u){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())}
async function writeZip(files){
  const parts=[],cen=[],te=new TextEncoder();let off=0,cs=0;
  for(const f of files){
    const nm=te.encode(f.path),crc=crc32(f.data);let d=f.data,m=0;
    if(f.deflate&&d.length>64){const z=await deflateRaw(d);if(z.length<d.length){d=z;m=8}}
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(8,m,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,nm.length,true);
    parts.push(h.buffer,nm,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(10,m,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,f.data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cen.push(c.buffer,nm);cs+=46+nm.length;off+=30+nm.length+d.length;
  }
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:'application/zip'});
}
const r2=x=>Math.round(x*100)/100;
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const safeName=t=>(t||'song').replace(/[\\/:*?"<>|]+/g,'_').slice(0,60);
// ================= Studio =================
let items=[]; // {label,src,chart,res:{samples:{key:entry},media:{key:entry}},meta:{title,artist},ext}
const say=(t,e)=>{$('msg').textContent=t||'';$('msg').className=e?'err':''};
const baseName=p=>p.replace(/\\/g,'/').split('/').pop();
const keyOf=(e)=>baseName(e.path).replace(/[\\/:*?"<>|]+/g,'_');
function mapRes(res,kind,find,file){
  if(!file)return null;const e=find(file,kind);if(!e)return null;
  const box=kind=='v'?res.media:res.samples;let k=keyOf(e),n=1;
  while(box[k]&&box[k]!==e){k=(n++)+'_'+keyOf(e)}box[k]=e;return k;
}
function bmsToItem(P,find,e){
  const res={samples:{},media:{}},sk=id=>mapRes(res,'a',find,P.wav[id]),bk=id=>mapRes(res,'v',find,P.bmp[id]);
  const cache={},sc=id=>id in cache?cache[id]:(cache[id]=sk(id));
  const snd=id=>{const k=sc(id);return k?{s:k,vel:127}:undefined};
  const sub=(P.H.SUBTITLE||'').trim(),disp=P.title||baseName(e.path);
  const ch={id:'',name:sub||disp,level:+P.level||0,mode:'keys',keys:7,timebase:'ms',bpm:r2(P.bpm),
    notes:P.notes.map(n=>{const o={t:r2(n.t),k:n.hold?'hold':'tap',lane:n.lane};if(n.hold)o.len=r2(n.end-n.t);const s=snd(n.snd.s);if(s)o.snd=s;return o}),
    back:P.back.map(b=>{const o={t:r2(b.t)};const s=snd(b.id);if(s)o.snd=s;return o})};
  if(P.bga.length){const bc={};ch.bga=P.bga.map(x=>({t:r2(x.t),media:x.id in bc?bc[x.id]:(bc[x.id]=bk(x.id)),layer:x.l}))}
  return{label:disp,file:baseName(e.path),src:'BMS',chart:ch,res,meta:{title:(P.H.TITLE||P.title||'').trim(),artist:P.artist},ext:{bms:{header:P.H}}};
}
function vosToItem(buf,name){
  const s=parseVos(buf),snd=e=>({midi:'vos',ch:e.ch,ins:e.ins,p:e.p,vel:e.vel,len:r2(e.dur*1000)});
  const ch={id:'',name:'',level:0,mode:'keys',keys:7,timebase:'ms',bpm:r2(s.bpm||120),
    notes:s.notes.map(n=>{const o={t:r2(n.t),k:n.hold?'hold':'tap',lane:n.lane,snd:snd(n.snd)};if(n.hold)o.len=r2(n.end-n.t);return o}),
    back:s.back.map(b=>({t:r2(b.t),snd:snd(b)})),ext:{vos:{ctl:s.ctl,mev:s.mev,chan:s.chan,tracks:s.tracks,lenMs:s.lenMs}}};
  return{label:name,src:'VOS',chart:ch,res:{samples:{},media:{}},meta:{title:s.title||'',artist:''},ext:{}};
}
async function importAll(list){
  list=[...list];if(!list.length)return;say('读取中…');items=[];
  try{
    let ents=[];
    for(const f of list){
      if(/\.(zip|rsm)$/i.test(f.name))ents.push(...await readZip(await f.arrayBuffer()));
      else ents.push({path:f.webkitRelativePath||f.name,ab:()=>f.arrayBuffer()});
    }
    const find=mkRes(ents);
    for(const e of ents){
      if(/\.(bms|bme|bml)$/i.test(e.path)){try{items.push(bmsToItem(parseBms(bmsText(await e.ab())),find,e))}catch(x){say('解析失败 '+e.path+'：'+x.message,1)}}
      else if(/\.(vos|vow)$/i.test(e.path)){try{items.push(vosToItem(await e.ab(),baseName(e.path)))}catch(x){say('解析失败 '+e.path+'：'+x.message,1)}}
    }
    const mf=ents.find(e=>/(^|\/)manifest\.json$/i.test(e.path));let man=null;
    if(mf)try{const m=JSON.parse(new TextDecoder().decode(await mf.ab()));if(m&&m.rsm)man=m}catch(x){}
    for(const e of ents.filter(e=>/\.rsc$/i.test(e.path))){
      let R;try{R=JSON.parse(new TextDecoder().decode(await e.ab()))}catch(x){continue}
      if(!R||!R.rsc||!Array.isArray(R.charts))continue;
      for(const c of R.charts){
        const res={samples:{},media:{}},used=new Set(),umed=new Set();
        for(const n of c.notes)if(n.snd&&n.snd.s!==undefined)used.add(n.snd.s);
        for(const b of c.back||[])if(b.snd&&b.snd.s!==undefined)used.add(b.snd.s);
        for(const b of c.bga||[])if(b.media)umed.add(b.media);
        const look=(arr,id)=>{const x=(arr||[]).find(y=>y.id===id);return x?find(x.file):null};
        for(const id of used){const en=look(man&&man.samples,id)||look(man&&man.tracks,id);if(en)res.samples[id]=en}
        for(const id of umed){const en=look(man&&man.media,id);if(en)res.media[id]=en}
        items.push({label:(c.name||R.meta&&R.meta.title||baseName(e.path)),src:'RSC',chart:c,res,meta:{title:R.meta&&R.meta.title||'',artist:R.meta&&R.meta.artist||''},ext:R.ext||{}});
      }
    }
    if(!items.length)throw new Error('没有找到可用的谱面（支持 .vos .vow .bms .bme .bml .rsc / .rsm，或包含它们的 .zip / 文件夹）');
    items.forEach(i=>i.on=true);
    $('mt').value=items[0].meta.title||'';$('ma').value=items[0].meta.artist||'';
    render();say('已读取 '+items.length+' 张谱面');
  }catch(err){items=[];render();say('导入失败：'+err.message,1)}
}
function render(){
  const tb=$('tb');tb.innerHTML='';
  if(!items.length){tb.innerHTML='<tr><td colspan="8" style="color:var(--mu)">还没有导入</td></tr>';$('exRsm').disabled=$('exRsc').disabled=true;return}
  items.forEach((it,i)=>{
    const tr=document.createElement('tr'),c=it.chart,lanes=new Set(c.notes.map(n=>n.lane)).size;
    tr.innerHTML=`<td><input type="checkbox" ${it.on?'checked':''}></td><td></td><td style="color:var(--mu)"></td><td class="n">${c.level||'-'}</td><td class="n">${lanes}</td><td class="n">${c.notes.length}</td><td class="n">${(c.back||[]).length}</td><td>${it.src}</td>`;
    tr.children[1].textContent=it.label;tr.children[2].textContent=it.file||'';tr.children[0].firstChild.onchange=e=>{it.on=e.target.checked;btn()};tb.appendChild(tr);
  });btn();
}
const btn=()=>{$('exRsm').disabled=$('exRsc').disabled=!items.some(i=>i.on)};
$('all').onclick=()=>{items.forEach(i=>i.on=true);render()};$('none').onclick=()=>{items.forEach(i=>i.on=false);render()};
function makeRsc(sel){
  const nm=safeName($('mt').value||sel[0].meta.title);
  return{rsc:1,meta:{title:$('mt').value||sel[0].meta.title||'',artist:$('ma').value||sel[0].meta.artist||'',source:{format:sel.every(i=>i.src==sel[0].src)?sel[0].src.toLowerCase():'mixed',tool:'Resonia Studio '+STUDIO_VERSION}},
    package:{rsm:nm+'.rsm'},charts:sel.map((i,k)=>({...i.chart,id:'c'+(k+1)})),ext:Object.assign({},...sel.map(i=>i.ext))};
}
$('exRsc').onclick=()=>{const sel=items.filter(i=>i.on);if(!sel.length)return;download(new Blob([JSON.stringify(makeRsc(sel))],{type:'application/json'}),safeName($('mt').value||sel[0].meta.title)+'.rsc')};
$('exRsm').onclick=async()=>{
  const sel=items.filter(i=>i.on);if(!sel.length)return;
  try{
    const R=makeRsc(sel),nm=safeName($('mt').value||sel[0].meta.title),te=new TextEncoder();
    const S={},M={};for(const i of sel){Object.assign(S,i.res.samples);Object.assign(M,i.res.media)}
    const man={rsm:1,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:R.meta.title,samples:[],tracks:[],midi:[],media:[]},files=[];
    const ext=e=>((e.path.match(/\.([^.]+)$/)||[])[1]||'bin').toLowerCase();
    const sk=Object.keys(S),mk=Object.keys(M);let n=0;
    for(const id of sk){say('打包 '+(++n)+' / '+(sk.length+mk.length));const e=S[id],x=ext(e),f='samples/'+id;
      files.push({path:f,data:new Uint8Array(await e.ab()),deflate:/^(wav|bmp)$/.test(x)});man.samples.push({id,file:f})}
    for(const id of mk){say('打包 '+(++n)+' / '+(sk.length+mk.length));const e=M[id],x=ext(e),f='bga/'+id;
      files.push({path:f,data:new Uint8Array(await e.ab()),deflate:/^(bmp)$/.test(x)});man.media.push({id,file:f,type:/^(mp4|webm|m4v)$/.test(x)?'video':'image'})}
    files.unshift({path:'manifest.json',data:te.encode(JSON.stringify(man,null,1)),deflate:true},{path:'charts/main.rsc',data:te.encode(JSON.stringify(R)),deflate:true});
    say('正在压缩…');download(await writeZip(files),nm+'.rsm');say('已导出 '+nm+'.rsm（'+sel.length+' 张谱面，'+sk.length+' 个音频，'+mk.length+' 个 BGA 素材）');
  }catch(err){say('导出失败：'+err.message,1)}
};
$('f').onchange=async e=>{await importAll(e.target.files);e.target.value=''};
$('d').onchange=async e=>{await importAll(e.target.files);e.target.value=''};
// 拖放：文件夹需要递归读取
async function walk(entry,out,path){
  if(entry.isFile){await new Promise(r=>entry.file(f=>{Object.defineProperty(f,'webkitRelativePath',{value:path+f.name});out.push(f);r()},r))}
  else if(entry.isDirectory){const rd=entry.createReader();let all=[];for(;;){const b=await new Promise(r=>rd.readEntries(r,()=>r([])));if(!b.length)break;all.push(...b)}
    for(const c of all)await walk(c,out,path+entry.name+'/')}
}
const dz=$('drop');
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();dz.classList.remove('on')}));
addEventListener('drop',async e=>{
  const its=[...(e.dataTransfer.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(!its.length){importAll(e.dataTransfer.files);return}
  say('读取中…');const out=[];for(const en of its)await walk(en,out,'');importAll(out);
});
