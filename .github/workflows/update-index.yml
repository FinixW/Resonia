name: 更新曲库清单
on:
  push:
    branches: [main]
    paths:
      - 'songs/**'
      - '!songs/index.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成 songs/index.json
        run: python3 tools/make-index.py
      - name: 有变化则提交
        run: |
          if [ -n "$(git status --porcelain songs/index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add songs/index.json
            git commit -m "自动更新曲库清单"
            git push
          fi
